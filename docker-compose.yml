services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: monitoring-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - monitoring-net

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=
    expose:
      - "3000"
    networks:
      - monitoring-net

  # Node.js Express Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: monitoring-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/monitoring
    expose:
      - "5000"
    depends_on:
      - mongodb
    networks:
      - monitoring-net

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: monitoring-mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - monitoring-net

  # SSL Certbot (Run on-demand for HTTPS certificates)
  certbot:
    image: certbot/certbot:latest
    container_name: monitoring-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
