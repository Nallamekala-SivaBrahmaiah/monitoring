services:
  # Next.js Full-Stack Application (Frontend + Server-Side Route Handlers + Cloud SDKs)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitoring-app
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/monitoring
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - monitoring-net

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: monitoring-mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
